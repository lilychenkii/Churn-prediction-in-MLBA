<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Product Management</title>
    <link rel="stylesheet" href="/back_end/wwwroot/asset/css/style.css">
    <style>
        .admin-container 
        { 
          max-width: 1200px; 
          margin: 40px auto; 
          padding: 20px; 
        }
        table 
        { 
            width: 100%; 
            border-collapse: collapse; 
            margin-top: 20px; 
        }
        th, td 
        { 
            border: 1px solid #ddd; 
            padding: 12px; 
            text-align: left; 
        }
        th 
        { 
            background-color: #f2f2f2; 
        }
        img.product-image 
        { 
            width: 60px; 
            height: 60px; 
            object-fit: cover; 
        }
        .action-btn 
        { 
            padding: 5px 10px; 
            margin-right: 5px; 
            cursor: pointer; 
        }
        .add-product-form 
        { 
            margin-top: 30px; 
            padding: 20px; 
            border: 1px solid #ddd; 
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <h1>Cake Product Management</h1>
        
        <table>
            <thead>
                <tr>
                    <th>Product ID</th>
                    <th>Image</th>
                    <th>Product Name</th>
                    <th>Price</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="product-list">
                </tbody>
        </table>

        <div class="add-product-form">
            <h2>Add New Product</h2>
            <form id="addProductForm">
                <input type="text" placeholder="Product name" required>
                <input type="number" placeholder="Price" required>
                <button type="submit" class="main-btn">Add Product</button>
            </form>
        </div>
    </div>

    <script src="/back_end/wwwroot/asset/js/menu.js"></script>
    
    <script>
        const productListBody = document.getElementById('product-list');

        // Function to display all products from the productsData variable (in menu.js)
        function displayProducts() {
            productListBody.innerHTML = ''; // Clear old data
            productsData.forEach(product => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${product.code}</td>
                    <td><img src="${product.image}" alt="${product.name}" class="product-image"></td>
                    <td>${product.name}</td>
                    <td>${product.price.toLocaleString('en-US')} VND</td>
                    <td>
                        <button class="action-btn">Edit</button>
                        <button class="action-btn">Delete</button>
                    </td>
                `;
                productListBody.appendChild(row);
            });
        }

        displayProducts();

        document.getElementById('addProductForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('PRODUCT ADDED SUCCESSFULLY! (Demo)');
            
            this.reset(); // Clear the form
        });
    </script>
</body>
</html>
