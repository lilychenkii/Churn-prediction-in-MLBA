<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Add New Product</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet"/>
    <link rel="stylesheet" href="/back_end/wwwroot/asset/css/style.css">
    <style>
        body { background-color: #f8f9fa; }
        .admin-panel { padding: 20px; background: white; box-shadow: 0 0 15px rgba(0,0,0,0.1); border-radius: 8px; margin-top: 40px;}
        .admin-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #dee2e6; padding-bottom: 15px; margin-bottom: 20px; }

        
        .form-container {
            max-width: 800px;
            margin: 30px auto;
            padding: 40px;
            border: 1px solid #e9ecef;
            border-radius: var(--main-border-radius);
            background-color: #ffffff;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .form-grid {
            display: grid;
            grid-template-columns: 150px 1fr; /* Cột label 150px, cột input chiếm phần còn lại */
            gap: 20px 30px; /* 20px khoảng cách dọc, 30px khoảng cách ngang */
            align-items: center; /* Căn giữa các item theo chiều dọc */
        }
        .form-group label {
            font-weight: 600;
            color: #495057;
            text-align: right; /* Căn lề phải cho label */
        }
        .form-group input[type="text"], .form-group input[type="number"] {
            font-size: 16px;
            padding: 12px;
            border: 1px solid #ced4da;
            width: 100%;
            transition: border-color 0.2s ease;
        }
        /* Hiệu ứng khi focus vào ô input */
        .form-group input:focus {
            border-color: var(--main-bg); 
            box-shadow: 0 0 0 2px rgba(225, 149, 171, 0.25);
        }

        /* Style cho nút Upload File */
        .image-upload-group {
            grid-column: 1 / -1; /* Cho phép group này chiếm toàn bộ chiều rộng grid */
            margin-top: 10px;
        }
        input[type="file"] {
            display: none; /* Ẩn nút upload mặc định */
        }
        .custom-file-upload {
            border: 1px solid var(--main-bg);
            color: var(--main-bg);
            display: inline-block;
            padding: 8px 15px;
            cursor: pointer;
            border-radius: var(--main-border-radius);
            font-weight: 600;
            transition: all 0.2s ease;
        }
        .custom-file-upload:hover {
            background-color: var(--main-bg);
            color: white;
        }

        /* Style cho khu vực xem trước ảnh */
        .image-preview-container {
            margin-top: 15px;
            text-align: center;
        }
        #image-preview {
            max-width: 200px;
            max-height: 200px;
            border: 1px solid #ddd;
            border-radius: var(--main-border-radius);
            display: none; /* Mặc định ẩn */
        }

        #create-form .main-btn {
            grid-column: 2 / 3; /* Đẩy nút bấm sang cột thứ 2 */
            margin-top: 20px;
            padding: 12px;
            font-size: 16px;
        }
        /* ============================================= */
    </style>
</head>
<body>
    <div class="container">
        <div class="admin-panel">
            <div class="admin-header">
                <h1>Add New Product</h1>
                <a href="admin_list.html" class="main-btn"><i class="ri-arrow-left-line"></i> Back to List</a>
            </div>
            <div class="form-container">
                <form id="create-form">
                    <div class="form-grid">
                        <input type="hidden" id="image-data">

                        <div class="form-group">
                            <label for="name">Product Name</label>
                            <input type="text" id="name" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="price">Price</label>
                            <input type="number" id="price" required>
                        </div>

                        <div class="form-group">
                            <label for="description">Description</label>
                            <textarea id="description" rows="4" style="width: 100%; padding: 12px; border: 1px solid #ced4da; border-radius: var(--main-border-radius); font-family: inherit;"></textarea>
                        </div>

                        <div class="form-group image-upload-group">
                            <label>Product Image</label>
                            <div>
                                <label for="image-upload" class="custom-file-upload">
                                    <i class="ri-upload-2-line"></i> Choose File
                                </label>
                                <input id="image-upload" type="file" accept="image/*">
                                <div class="image-preview-container">
                                    <img id="image-preview" src="#" alt="Image Preview"/>
                                </div>
                            </div>
                        </div>

                        <button type="submit" class="main-btn"><i class="ri-add-line"></i> Create Product</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="/fod-del/asset/js/admin_script.js"></script>
    
</body>
</html>
